name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar para iPhone (sin firmar)
        run: |
          set -o pipefail
          xcodebuild build \
            -project KonnectGPS.xcodeproj \
            -scheme KonnectGPS \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee build.log

      - name: Crear IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/KonnectGPS.app Payload/
          zip -qry KonnectGPS.ipa Payload

      - name: Publicar IPA en Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest KonnectGPS.ipa \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Konnect GPS - ultima build" \
            --notes "Build #${{ github.run_number }} (${{ github.sha }})" \
            --prerelease

      - name: Guardar log si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
